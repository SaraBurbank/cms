<div class="row">
   <div class="col-md-5">
      <div class="card mt-2">
         <div class="card-heading">
            <div class="row pad-left-right">
               <span class="title pull-left">Messages</span>
            </div>
         </div>
         <div class="card-body">
            <div class="row">
               <div class="col-xs-12">
                  @for (message of messages; track message.id) {
                     <cms-message-item [message]="message" (messageSelected)="OnSelected($event)" />}
               </div>
            </div>
         </div>
         <div class="card-footer">
            <cms-message-edit (addMessageEvent)="onAddMessage($event)" />
         </div>
      </div>
   </div>
</div>
