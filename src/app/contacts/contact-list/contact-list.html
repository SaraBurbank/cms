<div class="card mt-2">
    <div class="row">
        <div class="col-xs-12">
            <div class="panel-heading">
                <span class="title pad-left-right">Contacts</span>
                <div class="input-group pull-left pad-left-right col-xs-7">
                    <input type="text" class="form-control" placeholder="Enter a search value" (keyup)="search(searchBox.value)" [(ngModel)]="term" #searchBox >
                    <div class="glyphicon glyphicon-search input-group-addon" (click)="search(searchBox.value)"></div>
                </div>
                <div class="pull-right pad-left-right">
                    <a class="btn btn-success" [routerLink]="['new']">New Contact</a>
                </div>
            </div>
        </div>
    </div>
    <div class="card-body">
        <div class="card-list list-group">
            @for (contact of contacts | contactsFilter: term; track contact.id) {
                <a routerLinkActive="active" [routerLink]="[contact.id]">
                    <cms-contact-item [contact]="contact" [id]="contact.id" />
                </a>
            }
        </div>
    </div>
</div>
