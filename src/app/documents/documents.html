<div class="row">
  <div class="col-md-5">
    <cms-document-list (selectedDocumentEvent)="selectedDocument = $event"/>
  </div>
  <div class="col-md-4">
    @if (selectedDocument) {
      <cms-document-detail [document]="selectedDocument"/>
    } @else {
      <ng-template>
        <p class="text-muted">Please select a document to see details.</p>
      </ng-template>
    }
  </div>
</div>
