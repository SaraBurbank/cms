<div class="card mt-2" xmlns="http://www.w3.org/1999/html">
  <div class="card-header">
    <h4 class="title margin-left-right">{{document.name}}</h4>
    <div class="float-end margin-left-right">
      <a class="btn btn-primary ms-2" (click)="onView()" >View</a>
      <a class="btn btn-info ms-2" routerLink="./edit" >Edit</a>
      <a class="btn btn-danger ms-2" (click)="onDelete()">Delete</a>
    </div>
  </div>
  <div class="card-body">
    <div class="row">
      <label>Description:</label>
      <span class="label-value">{{document.description}}</span>
    </div>
    <br>
    <div class="row">
      <label>URL:</label>
      <span class="label-value">{{document.url}}</span>
    </div>
  </div>
</div>
